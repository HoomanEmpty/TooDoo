[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "TooDoo"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
task = "task_app:main"

[tool.setuptools]
py-modules = ["task_app", "storage", "input_handler", "display"]